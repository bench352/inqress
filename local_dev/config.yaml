server:
  host: 0.0.0.0
  port: 8000
  debug: false
  api_docs: true

app:
  organization_name: "Example Ltd."
  default_country_code: "HK"

auth:
  admin_username: "NeverGonnaGiveYouUp"
  admin_password: "NeverGonnaLetYouDown"
  cookie_secure: false
  session_idle_days: 30
  session_absolute_days: 90
  login_rate_limit:
    enabled: true
    max_failures: 10
    window_seconds: 900
    # Address or CIDR of the reverse proxy only. Never 0.0.0.0/0.
    # Leave empty when clients connect to this process directly.
    trusted_proxies: []

# Email sending functionalities are not available in hot-reload dev server
email_smtp:
  host: "smtp.example.com"
  port: 420
  username: "noreply@example.com"
  password: "<not-a-password>"
  display_email: chriswong@example.com
  wait_between_delivery_second: 5