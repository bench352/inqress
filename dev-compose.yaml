services:
  inqress:
    restart: always
    build:
      context: .
      args:
        APP_VERSION: dev
    image: notbench352/inqress:dev
    ports:
      - "7000:8000"
    environment:
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./local_dev/data:/app/data
      - ./local_dev/config.yaml:/app/config.yaml
    networks:
      - dev
    develop:
      watch:
        # Backend source: sync then restart (release process)
        - action: sync+restart
          path: ./backend/src
          target: /app/src
          initial_sync: true
          ignore:
            - __pycache__/
            - "*.pyc"

        # Frontend source and lockfiles: full rebuild (baked into image)
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/

        - action: rebuild
          path: ./backend/pyproject.toml

        - action: rebuild
          path: ./backend/uv.lock

        - action: rebuild
          path: ./Dockerfile
  # Reverse proxy for HTTPS
  caddy:
    image: caddy:2-alpine
    user: "0:0"
    restart: always
    ports:
      - "7443:443"
    volumes:
      - ./local_dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - ~/.certs:/certs:ro
    networks:
      - dev
    depends_on:
      - inqress

networks:
  dev:
    ipam:
      config:
        - subnet: 172.31.210.0/24
